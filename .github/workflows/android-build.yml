name: android-build

# Builds the Android port on a hosted Linux runner. There is no signing
# identity in CI: the debug APK is installable as-is, and a manual run also
# produces the release APK, signed with the debug key by android/app's Gradle
# configuration. Nothing is published to a store from here.
# The app's native library compiles a set of files out of tools/ (rootfs
# provisioning, the file-block device, payload extraction, SHA-256 and the
# iOS 3 host shims, see android/app/src/main/cpp/CMakeLists.txt), so a change
# there changes the APK and has to run this job.
on:
  push:
    branches:
      - android-port
    paths:
      - 'android/**'
      - 'core/**'
      - 'app/Sources/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'core/**'
      - 'app/Sources/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository does not commit a wrapper jar. Pin the Gradle that the
      # project was written against (AGP 8.7.3 requires 8.9 or newer).
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The action defaults to installing "tools", a package that no longer
      # exists in the SDK repository; that makes sdkmanager fail before our
      # own install step runs. platform-tools is the only one we need here.
      - name: Set up the Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install platform, build tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build the release and debug APKs
        run: gradle -p android :app:assembleRelease :app:assembleDebug --stacktrace

      # The release variant is signed with the debug key (see app/build.gradle.kts)
      # so it is installable for testing without store signing.
      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: s5landbox-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: s5landbox-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
