name: android-build

# Builds the Android port on a hosted Linux runner. There is no signing
# identity in CI: the debug APK is installable as-is, and a manual run also
# produces the release APK, signed with the debug key by android/app's Gradle
# configuration. Nothing is published to a store from here.
# The app's native library compiles a set of files out of tools/ (rootfs
# provisioning, the file-block device, payload extraction, SHA-256 and the
# iOS 3 host shims, see android/app/src/main/cpp/CMakeLists.txt), so a change
# there changes the APK and has to run this job.
on:
  push:
    branches:
      - android-port
      - main
      - 'graphics/**'
    paths:
      - 'android/**'
      - 'core/**'
      - 'app/Sources/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
      - android-port
    paths:
      - 'android/**'
      - 'core/**'
      - 'app/Sources/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository does not commit a wrapper jar. Pin the Gradle that the
      # project was written against (AGP 8.7.3 requires 8.9 or newer).
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The action defaults to installing "tools", a package that no longer
      # exists in the SDK repository; that makes sdkmanager fail before our
      # own install step runs. platform-tools is the only one we need here.
      - name: Set up the Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install platform, build tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --install "cmake;3.22.1"
          sdkmanager --install "ndk;27.0.12077973" || (sleep 5 && sdkmanager --install "ndk;27.0.12077973")

      # HyperHLE's GLES core is a Rust crate (android/rust/hyperhle-gles).
      # It is built for every ABI the APK ships.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build the HyperHLE GLES core
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export NDK_HOME="$ANDROID_NDK_HOME"
          ROOT_DIR="$(pwd)"
          cd android/rust/hyperhle-gles
          cargo ndk \
            -t arm64-v8a -t x86_64 \
            -o "$ROOT_DIR/android/app/src/main/jniLibs" \
            build --release

      - name: Build the release and debug APKs
        run: gradle -p android :app:assembleRelease :app:assembleDebug --stacktrace

      # The release variant is signed with the debug key (see app/build.gradle.kts)
      # so it is installable for testing without store signing.
      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: s5landbox-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: s5landbox-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APKs for GitHub Release
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/s5landbox-release.apk
          cp android/app/build/outputs/apk/debug/*.apk dist/s5landbox-debug.apk

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/android-port' || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: "S5LAndBox Android Build"
          body: |
            Automated Android build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            - **`s5landbox-release.apk`**: Optimized build with `-O3 -fomit-frame-pointer` (recommended).
            - **`s5landbox-debug.apk`**: Debug build.
          prerelease: true
          files: |
            dist/s5landbox-release.apk
            dist/s5landbox-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        if: always()
        run: python3 tools/notify_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          BUILD_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
